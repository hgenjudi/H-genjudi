<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ec4899">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小何根据地">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/H-genjudi/icon-192.png">
<link rel="manifest" href="/H-genjudi/manifest.json">
<title>小何根据地</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{
  --pink-50:#fdf2f8;
  --pink-100:#fce7f3;
  --pink-200:#fbcfe8;
  --pink-300:#f9a8d4;
  --pink-400:#f472b6;
  --pink-500:#ec4899;
  --pink-600:#db2777;
  --pink-700:#be185d;
  --pink-800:#9d174d;
  --pink-900:#831843;
  --rose-50:#fff1f2;
  --rose-100:#ffe4e6;
  --rose-200:#fecdd3;
  --rose-300:#fda4af;
  --rose-400:#fb7185;
  --rose-500:#f43f5e;
  --gray-50:#fafafa;
  --gray-100:#f4f4f5;
  --gray-200:#e4e4e7;
  --gray-300:#d4d4d8;
  --gray-400:#a1a1aa;
  --gray-500:#71717a;
  --gray-600:#52525b;
  --gray-700:#3f3f46;
  --gray-800:#27272a;
  --gray-900:#18181b;
  --bg:#fef6fa;
  --card:#ffffff;
  --text:#27272a;
  --text-soft:#52525b;
  --text-mute:#a1a1aa;
  --border:#fce7f3;
  --primary:#ec4899;
  --primary-soft:#fce7f3;
  --primary-dark:#db2777;
  --primary-light:#fbcfe8;
  --accent:#f472b6;
  --warn:#f59e0b;
  --warn-bg:#fffbeb;
  --danger:#ef4444;
  --danger-bg:#fef2f2;
  --success:#10b981;
  --success-bg:#ecfdf5;
  --info:#3b82f6;
  --info-bg:#eff6ff;
  --shadow:0 1px 3px rgba(236,72,153,.06),0 4px 12px rgba(236,72,153,.05);
  --shadow-sm:0 1px 2px rgba(236,72,153,.04);
  --radius:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
  background:linear-gradient(135deg,#fef6fa 0%,#fff1f5 30%,#fdf2f8 60%,#fff5f7 100%);
  background-attachment:fixed;
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{
  font-family:inherit;font-size:14px;outline:none;
  border:1px solid var(--border);background:#fff;
  border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);width:100%;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(236,72,153,.15)}
textarea{resize:vertical;min-height:80px}
a{color:var(--primary);text-decoration:none}

/* ─── Layout ─── */
.app{display:flex;min-height:100vh;width:100%}
.sidebar{
  width:240px;
  background:linear-gradient(180deg,#fdf2f8 0%,#fce7f3 40%,#fef2f7 100%);
  border-right:1px solid var(--border);
  padding:20px 14px;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;flex-shrink:0;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  z-index:50;
  box-shadow:2px 0 24px rgba(236,72,153,.04);
}
.brand{
  display:flex;align-items:center;gap:12px;margin-bottom:24px;
  padding:10px 10px;
  background:linear-gradient(135deg,#fdf2f8,#fff);
  border-radius:16px;border:1px solid var(--pink-100);
  box-shadow:0 2px 8px rgba(236,72,153,.06);
}
.brand-logo{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#ec4899,#f472b6,#db2777);
  background-size:200% 200%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:20px;
  box-shadow:0 4px 12px rgba(236,72,153,.35);
  animation:logoShine 3s ease infinite;
}
@keyframes logoShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand-info{line-height:1.3}
.brand-name{font-weight:700;font-size:15px;color:var(--pink-700)}
.brand-sub{font-size:10px;color:var(--pink-400);margin-top:2px}
.nav-group{margin-top:8px}
.nav-group-title{
  font-size:10px;color:var(--pink-300);padding:6px 12px 4px;
  text-transform:uppercase;letter-spacing:1.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.nav-group-title::after{content:'';flex:1;height:1px;background:var(--pink-100)}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:12px;
  color:var(--text-soft);cursor:pointer;
  margin-bottom:2px;font-weight:500;font-size:13px;
  transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;
  overflow:hidden;
}
.nav-item::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--pink-100),var(--rose-100));
  opacity:0;transition:opacity .2s;
}
.nav-item:hover{color:var(--pink-600)}
.nav-item:hover::before{opacity:.5}
.nav-item.active{
  background:linear-gradient(135deg,var(--pink-500),var(--rose-500));
  color:#fff;box-shadow:0 4px 16px rgba(236,72,153,.35);
  font-weight:600;
}
.nav-item.active::before{opacity:0}
.nav-item .badge{
  position:absolute;right:12px;
  background:rgba(255,255,255,.9);color:var(--pink-600);
  font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600;
}
.nav-item.active .badge{background:rgba(255,255,255,.3);color:#fff}
.nav-icon{font-size:18px;width:24px;text-align:center;position:relative;z-index:1}
.nav-label{position:relative;z-index:1}
.nav-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  margin-left:auto;opacity:0;transition:opacity .2s;
}
.nav-item:hover .nav-dot{opacity:1;background:var(--pink-400)}
.nav-item.active .nav-dot{opacity:1;background:rgba(255,255,255,.6)}

.main{flex:1;min-width:0;padding:28px 32px;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:14px}
.hamburger{
  display:none;width:40px;height:40px;border-radius:12px;
  background:#fff;border:1px solid var(--border);align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.page-title{
  font-size:24px;font-weight:800;color:var(--gray-800);
  background:linear-gradient(135deg,var(--pink-600),var(--pink-800));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.page-subtitle{font-size:12px;color:var(--text-mute);margin-top:2px;font-weight:400}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:10px;
  background:linear-gradient(135deg,var(--pink-500),var(--rose-500));
  color:#fff;font-weight:600;transition:all .2s cubic-bezier(.4,0,.2,1);font-size:13px;
  box-shadow:0 2px 8px rgba(236,72,153,.2);
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(236,72,153,.3)}
.btn:hover::after{opacity:1}
.btn:active{transform:translateY(0)}
.btn-ghost{
  background:#fff;color:var(--text-soft);
  border:1.5px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.btn-ghost:hover{background:var(--pink-50);color:var(--pink-600);transform:translateY(-1px);box-shadow:0 4px 12px rgba(236,72,153,.1)}
.btn-ghost::after{display:none}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-outline{background:transparent;border:1.5px solid var(--pink-300);color:var(--pink-600);box-shadow:none}
.btn-outline:hover{background:var(--pink-50);box-shadow:0 2px 8px rgba(236,72,153,.1)}
.btn-outline::after{display:none}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 2px 8px rgba(239,68,68,.2)}
.btn-danger:hover{box-shadow:0 6px 20px rgba(239,68,68,.3)}

.module{display:none;animation:moduleIn .4s cubic-bezier(.4,0,.2,1)}
.module.active{display:block}
@keyframes moduleIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ─── Cards ─── */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{
  background:var(--card);border-radius:16px;padding:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(236,72,153,.04);
  border:1px solid var(--border);
  transition:box-shadow .3s,transform .3s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--pink-400),var(--rose-400),var(--pink-400));
  background-size:200% 100%;
  opacity:0;transition:opacity .3s;
}
.card:hover{box-shadow:0 4px 16px rgba(236,72,153,.08),0 12px 32px rgba(236,72,153,.04)}
.card:hover::before{opacity:1}
.card-title{
  font-size:14px;font-weight:700;color:var(--gray-700);margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-soft{background:linear-gradient(135deg,var(--pink-50),var(--rose-50))}

.stat{
  display:flex;flex-direction:column;gap:8px;
  padding:18px 20px;border-radius:14px;
  background:linear-gradient(135deg,#fdf2f8,#fff,#fdf2f8);
  border:1px solid var(--pink-100);
  transition:transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:60px;height:60px;border-radius:50%;
  background:var(--pink-100);opacity:.3;
}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(236,72,153,.1)}
.stat-value{
  font-size:28px;font-weight:800;
  background:linear-gradient(135deg,var(--pink-500),var(--pink-700));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;position:relative;z-index:1;
}
.stat-label{font-size:12px;color:var(--text-mute);position:relative;z-index:1}
.stat-sub{font-size:11px;color:var(--text-soft);position:relative;z-index:1}
.stat-icon-wrap{font-size:20px;margin-bottom:2px;position:relative;z-index:1}
.stat-todo{border-left:3px solid var(--pink-400)}
.stat-money{border-left:3px solid #10b981}
.stat-fitness{border-left:3px solid #3b82f6}
.stat-football{border-left:3px solid #f59e0b}
.stat-create{border-left:3px solid #8b5cf6}

/* ─── Overview Header ─── */
.overview-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;margin-bottom:20px;
  background:linear-gradient(135deg,#fdf2f8,#fff,#fce7f3);
  border-radius:18px;border:1px solid var(--pink-100);
  box-shadow:0 2px 12px rgba(236,72,153,.05);
}
.ov-greeting{line-height:1.4}
.ov-greet-text{font-size:22px;font-weight:800;color:var(--pink-700)}
.ov-date-text{font-size:13px;color:var(--text-mute);margin-top:4px;font-weight:500}
.ov-deco{font-size:36px;opacity:.8}

/* ─── Quick Actions ─── */
.quick-actions{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;
}
.qa-item{
  display:flex;align-items:center;gap:8px;
  padding:12px 18px;border-radius:14px;
  background:#fff;border:1px solid var(--border);
  cursor:pointer;font-size:13px;font-weight:500;
  transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.02);
  flex:1;min-width:120px;justify-content:center;
}
.qa-item:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(236,72,153,.1);
  border-color:var(--pink-300);
  background:var(--pink-50);
}
.qa-icon{font-size:18px}

/* ─── Lists ─── */
.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:12px;
  background:var(--gray-50);border:1px solid var(--gray-100);
  transition:all .2s;position:relative;
}
.list-item:hover{background:var(--pink-50);border-color:var(--pink-100);transform:translateX(2px)}
.list-item.done .title{text-decoration:line-through;color:var(--text-mute)}
.list-item.done{opacity:.65}

.tag{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:999px;font-size:11px;font-weight:600;
  background:var(--pink-100);color:var(--pink-600);
  white-space:nowrap;transition:transform .15s;
}
.tag:hover{transform:scale(1.05)}
.tag-warn{background:var(--warn-bg);color:#92400e}
.tag-danger{background:var(--danger-bg);color:#991b1b}
.tag-success{background:var(--success-bg);color:#166534}
.tag-info{background:var(--info-bg);color:#1e40af}
.tag-gray{background:var(--gray-100);color:var(--gray-600)}
.tag-purple{background:#ede9fe;color:#5b21b6}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-pink{background:#fce7f3;color:#9d174d}

.check{
  width:22px;height:22px;border-radius:7px;
  border:2px solid var(--pink-300);flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:#fff;transition:all .2s;font-size:13px;color:transparent;
}
.check:hover{border-color:var(--pink-500);transform:scale(1.1)}
.check.checked{background:var(--pink-500);border-color:var(--pink-500);color:#fff;box-shadow:0 2px 8px rgba(236,72,153,.3)}

/* ─── Form ─── */
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.form-row>*{flex:1;min-width:140px}
.form-group{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text-soft);margin-bottom:4px;font-weight:600}
.empty{text-align:center;color:var(--text-mute);padding:36px 10px;font-size:13px}

/* ─── Progress ─── */
.progress{height:10px;background:var(--pink-100);border-radius:999px;overflow:hidden;margin-top:6px}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--pink-400),var(--rose-400),var(--pink-600));
  background-size:200% 100%;
  transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:999px;
  animation:progressShine 2s ease infinite;
}
@keyframes progressShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ─── Modal ─── */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;z-index:100;padding:16px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-mask.show{display:flex;animation:maskIn .2s ease}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;width:100%;
  max-width:500px;padding:24px;max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.18);
  animation:modalIn .3s cubic-bezier(.4,0,.2,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--pink-700)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ─── Finance timeline (日/月/年) ─── */
.finance-timeline{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.fin-tier{
  display:flex;align-items:center;gap:14px;
  border-radius:14px;padding:14px 18px;
  border:1px solid var(--border);background:#fff;
  transition:transform .2s,box-shadow .2s;
}
.fin-tier:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.04)}
.fin-tier-today{background:linear-gradient(135deg,#fdf2f8,#fff);border-color:var(--pink-200);border-left:3px solid var(--pink-500)}
.fin-tier-month{background:linear-gradient(135deg,#f0fdf4,#fff);border-color:#bbf7d0;border-left:3px solid #10b981}
.fin-tier-year{background:linear-gradient(135deg,#eff6ff,#fff);border-color:#bfdbfe;border-left:3px solid #3b82f6}
.fin-tier-label{
  font-weight:800;font-size:14px;min-width:60px;
  background:linear-gradient(135deg,var(--gray-700),var(--gray-900));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.fin-tier-row{display:flex;flex:1;gap:18px;justify-content:space-around}
.fin-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.fin-stat-val{font-size:20px;font-weight:800}
.fin-stat-lbl{font-size:10px;color:var(--text-mute);font-weight:500}
@media (max-width: 768px){
  .fin-tier{flex-direction:column;align-items:flex-start;gap:8px}
  .fin-tier-row{gap:12px}
  .fin-stat-val{font-size:16px}
}

/* ─── Sidebar mask ─── */
.sidebar-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}

/* ─── Toast ─── */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--gray-800);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s,top .25s cubic-bezier(.4,0,.2,1);box-shadow:0 12px 32px rgba(0,0,0,.2);
}
.toast.show{opacity:1;top:32px}

/* ─── Switch ─── */
.switch{
  position:relative;width:36px;height:20px;
  background:var(--gray-300);border-radius:999px;cursor:pointer;transition:.2s;flex-shrink:0;
}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--pink-500)}
.switch.on::after{left:18px}

/* ─── Pills ─── */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:999px;
  background:#fff;border:1px solid var(--border);
  font-size:12px;cursor:pointer;transition:all .15s;
}
.pill:hover{background:var(--pink-50);border-color:var(--pink-200)}
.pill.active{background:var(--pink-500);color:#fff;border-color:var(--pink-500)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}

/* ─── Special items ─── */
.heat-item{
  padding:14px;border-radius:12px;
  background:linear-gradient(135deg,var(--pink-50),var(--rose-50));
  border:1px solid var(--pink-100);margin-bottom:10px;
}
.heat-title{font-weight:600;color:var(--pink-800);margin-bottom:6px}

.countdown-card{
  display:flex;flex-direction:column;align-items:center;
  padding:18px 12px;border-radius:14px;background:#fff;border:1px solid var(--border);
  transition:transform .2s,box-shadow .2s;
}
.countdown-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(236,72,153,.08)}
.countdown-card.urgent{background:linear-gradient(135deg,#fef2f2,#fff);border-color:#fecaca}
.countdown-card.soon{background:linear-gradient(135deg,#fffbeb,#fff);border-color:#fde68a}
.countdown-val{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--pink-500),var(--pink-700));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.countdown-card.urgent .countdown-val{background:linear-gradient(135deg,#dc2626,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.countdown-card.soon .countdown-val{background:linear-gradient(135deg,#d97706,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.countdown-name{font-size:13px;font-weight:700;margin-top:4px;text-align:center}
.countdown-date{font-size:11px;color:var(--text-mute)}
.countdown-lunar{font-size:11px;color:var(--pink-500);margin-top:2px;text-align:center}
.countdown-remind{font-size:10px;color:var(--pink-400);margin-top:2px;text-align:center}

/* ─── 农历转换（浏览器原生 Intl API，准确可靠） ─── */
const LUNAR_FMT = (()=>{
  try{return new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric'})}catch(e){return null}
})();
const STEM = '甲乙丙丁戊己庚辛壬癸';
const BRANCH = '子丑寅卯辰巳午未申酉戌亥';
const ZODIAC = '鼠牛虎兔龙蛇马羊猴鸡狗猪';
const LUN_DAY_MAP = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
// 中文数字 → 阿拉伯数字
const CN_NUM = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12,'冬':11,'腊':12};
function cnToNum(s){
  // 去掉"月"字，只保留月份数字部分
  const clean = s.replace('月','');
  return CN_NUM[clean]||parseInt(clean)||1;
}

function lunarYear(y){return STEM[(y-4)%10]+BRANCH[(y-4)%12]+ZODIAC[(y-4)%12]}

function lunarDateStr(d){
  if(!LUNAR_FMT)return'';
  const parts = LUNAR_FMT.formatToParts(d);
  const obj={};parts.forEach(p=>{if(p.type!=='literal')obj[p.type]=p.value});
  const mStr = obj.month||'';const dStr = obj.day||'';
  const mNum = cnToNum(mStr.replace('闰',''));
  const dNum = parseInt(dStr)||1;
  const isLeap = mStr.includes('闰');

  if(!isLeap){
    if(mNum===1&&dNum===1)return'春节';
    if(mNum===1&&dNum===15)return'元宵节';
    if(mNum===5&&dNum===5)return'端午节';
    if(mNum===7&&dNum===7)return'七夕';
    if(mNum===7&&dNum===15)return'中元节';
    if(mNum===8&&dNum===15)return'中秋节';
    if(mNum===9&&dNum===9)return'重阳节';
  }
  return (isLeap?'闰':'')+mStr.replace('闰','')+(LUN_DAY_MAP[dNum]||('第'+dNum+'天'));
}

/* ─── 1. 今日概览 ─── */
function renderOverview(){
  const c=$('#content-overview');
  const d=state.data;const td=today();const tm=thisMonth();
  const todayTodos=d.todo.filter(t=>!t.done||t.doneDate===td);
  const doneToday=todayTodos.filter(t=>t.done).length;
  const todayExp=d.finance.filter(f=>f.date===td&&f.type==='expense').reduce((s,f)=>s+Number(f.amount||0),0);
  const monthExp=d.finance.filter(f=>f.type==='expense'&&f.date.startsWith(tm)).reduce((s,f)=>s+Number(f.amount||0),0);
  const reading=d.reading.filter(b=>!b.done).length;
  const ideas=d.ideas.length;const scripts=d.scripts.length;
  const upcoming=d.countdown.map(c=>({...c,left:daysBetween(c.date)})).filter(c=>c.left>=0).sort((a,b)=>a.left-b.left).slice(0,4);
  const fitDays=Object.keys(d.fitness).filter(k=>k.startsWith(tm)&&d.fitness[k]).length;
  const fbMonth=d.football.filter(f=>f.date.startsWith(tm));
  const fbWin=fbMonth.filter(f=>f.result==='win').length;
  const fbTotal=fbMonth.length;
  const fbGuess=fbMonth.filter(f=>f.guess);
  const fbCorrect=fbGuess.filter(f=>f.guess===f.result).length;

function renderTodo(){
  const c=$('#content-todo');
  const all=state.data.todo;const td=today();
  const filter=state._todoFilter||'all';
  const todayItems=all.filter(t=>t.date===td||!t.done);

  let list=all;
  if(filter==='today')list=todayItems;
  else if(filter==='done')list=all.filter(t=>t.done);
  else if(filter==='undone')list=all.filter(t=>!t.done);

  const totalToday=todayItems.length;
  const doneToday=todayItems.filter(t=>t.done).length;
  const pct=totalToday?Math.round(doneToday/totalToday*100):0;

  c.innerHTML=`
    <div class="toolbar">
      ${[
        ['all','全部',all.length],
        ['today','今日',todayItems.length],
        ['undone','未完成',all.filter(t=>!t.done).length],
        ['done','已完成',all.filter(t=>t.done).length]
      ].map(([k,lbl,n])=>`<span class="pill ${filter===k?'active':''}" onclick="setTodoFilter('${k}')">${lbl} (${n})</span>`).join('')}
      <div style="flex:1"></div>
      <button class="btn btn-sm" onclick="openTodoAdd()">+ 新增任务</button>
    </div>
    ${totalToday?`
    <div class="card card-soft" style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">📊 今日进度 ${doneToday}/${totalToday} (${pct}%)</div>
      <div class="progress" style="height:10px"><div class="progress-bar" style="width:${pct}%"></div></div>
    </div>`:''}
    <div class="card">
      ${list.length?`<div class="list">${list.map(t=>`
        <div class="list-item ${t.done?'done':''}">
          <span class="check ${t.done?'checked':''}" onclick="toggleTodo('${t.id}')">${t.done?'✓':''}</span>
          <div class="title" style="cursor:pointer" onclick="editTodo('${t.id}')">${esc(t.text)}</div>
          ${t.date&&t.date!==td?`<span class="tag tag-info">${t.date}</span>`:''}
          ${t.priority?`<span class="tag ${t.priority==='high'?'tag-danger':t.priority==='mid'?'tag-warn':'tag-gray'}">${t.priority==='high'?'高':t.priority==='mid'?'中':'低'}</span>`:''}
          <button class="icon-btn danger" onclick="deleteTodo('${t.id}')" title="删除">🗑</button>
        </div>`).join('')}</div>`:`<div class="empty">暂无任务</div>`}
    </div>
  `;
}
function setTodoFilter(f){state._todoFilter=f;renderTodo()}
function openTodoAdd(id){
  const v=id?state.data.todo.find(x=>x.id===id):{text:'',date:today(),priority:'mid'};
  openModal(`
    <div class="modal-title">${id?'编辑':'新增'}任务</div>
    <div class="form-row"><input id="m-text" placeholder="任务内容" value="${esc(v.text)}" autofocus></div>

        <option value="low" ${v.priority==='low'?'selected':''}>低优先级</option>

        <option value="high" ${v.priority==='high'?'selected':''}>高优先级</option>
      </select>
    </div>

function saveTodo(id){
  const text=$('#m-text').value.trim();
  if(!text){toast('请填写任务');return}
  const date=$('#m-date').value||today(),priority=$('#m-priority').value;
  if(id){const t=state.data.todo.find(x=>x.id===id);if(t){t.text=text;t.date=date;t.priority=priority}}
  else{state.data.todo.unshift({id:uid(),text,date,priority,done:false})}
  saveState();closeModal();renderTodo();renderOverview();toast('已保存');
}
function toggleTodo(id){
  const t=state.data.todo.find(x=>x.id===id);
  if(t){t.done=!t.done;t.doneDate=t.done?today():null;saveState();renderTodo();renderOverview()}
}
function editTodo(id){openTodoAdd(id)}
function deleteTodo(id){
  if(!confirm('确认删除？'))return;
  state.data.todo=state.data.todo.filter(x=>x.id!==id);
  saveState();renderTodo();renderOverview();toast('已删除');
}

// ─── 消费分析引擎 ───
// 不必要消费判定规则：按分类 + 关键词
const UNNECESSARY_RULES = [
  {cat:'fun',     label:'娱乐消费',    msg:'娱乐支出属于弹性消费，建议设定月度预算上限'},
  {cat:'shopping',label:'购物消费',    msg:'非必需品购物建议三思而后行，可尝试「48小时冷静期」'},
  {cat:'beauty',  label:'美妆消费',    msg:'美妆产品容易冲动购买，建议用完再补，避免囤货'},
  {cat:'digital', label:'数码消费',    msg:'数码产品更新换代快，建议评估是否刚需再入手'},
];
// 可标记「必要/不必要」的备注关键词（用户可在记账备注中添加）
const NECESSARY_KEYWORDS = ['必需','必要','刚需','生活必需品','通勤','话费','房租','房贷','水电','燃气','药'];
function isUnnecessary(f){
  // 先看分类
  const rule = UNNECESSARY_RULES.find(r=>r.cat===f.category);
  if(!rule) return {unnecessary:false,reason:''};
  // 再看备注关键词
  const note = (f.note||'').toLowerCase();
  const isNecessary = NECESSARY_KEYWORDS.some(k=>note.includes(k));
  if(isNecessary) return {unnecessary:false,reason:''};
  return {unnecessary:true,reason:rule.msg,categoryLabel:rule.label};
}

let _lastRemindCheck = '';
function checkCountdownReminders(){
  const td = today();
  if(_lastRemindCheck===td)return;
  _lastRemindCheck = td;
  state.data.countdown.forEach(x=>{
    if(!x.remind && x.remind!==0)return;
    const target = new Date(x.date+'T00:00:00');
    const left = daysBetween(x.date);
    if(left===x.remind || (x.remind===0 && left===0)){
      // 尝试浏览器通知
      if('Notification' in window && Notification.permission==='granted'){
        new Notification('📅 '+x.name,{body:left===0?'就在今天！':`还有 ${left} 天`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23ec4899"/><text x="50" y="65" text-anchor="middle" fill="white" font-size="40">📅</text></svg>'});
      }
      toast('🔔 '+x.name + (left===0?' · 就在今天！':' · 还有 '+left+' 天'));
    }
  });
}

function renderFitness(){
  const c=$('#content-fitness');const tm=thisMonth();
  const dim=daysInMonth(tm);
  const [y,m]=tm.split('-').map(Number);
  const now=new Date();
  const todayIdx=now.getMonth()+1===m&&now.getFullYear()===y?now.getDate():0;

  // 统计
  const doneDays=[];for(let d=1;d<=dim;d++){const k=`${tm}-${String(d).padStart(2,'0')}`;if(state.data.fitness[k])doneDays.push(d)}
  const doneCount=doneDays.length;

  // 连续天数
  let streak=0;
  for(let d=todayIdx||dim;d>=1;d--){
    const k=`${tm}-${String(d).padStart(2,'0')}`;
    if(state.data.fitness[k])streak++;else break;
  }

  c.innerHTML=`
    <div class="grid grid-3" style="margin-bottom:14px">
      <div class="stat"><div class="stat-label">本月健身</div><div class="stat-value">${doneCount}/${dim}</div><div class="stat-sub">${dim?Math.round(doneCount/dim*100):0}% 完成率</div></div>
      <div class="stat"><div class="stat-label">连续打卡</div><div class="stat-value">${streak}天</div><div class="stat-sub">🔥 继续加油</div></div>
      <div class="stat"><div class="stat-label">今日状态</div><div class="stat-value">${state.data.fitness[today()]?'💪':'😴'}</div><div class="stat-sub">${state.data.fitness[today()]?'已完成':'还没打卡'}</div></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-sm" onclick="fitnessToggleToday()">${state.data.fitness[today()]?'取消今日打卡':'🏃 今日打卡'}</button>
      <span style="font-size:12px;color:var(--text-mute)">${tm} 打卡日历</span>
      <div style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportFitness()">导出Excel</button>
    </div>

    <div class="card">
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${Array.from({length:dim},(_,i)=>i+1).map(d=>{
          const k=`${tm}-${String(d).padStart(2,'0')}`;
          const done=state.data.fitness[k];
          const isToday=d===todayIdx;
          return `<div class="fitness-day ${done?'done':''}" onclick="fitnessToggle('${k}')" title="${k}${done?' ✓':''}">
            <span style="font-size:10px;color:${isToday?'var(--pink-500)':'var(--text-mute)'};font-weight:${isToday?'700':'400'}">${['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()]}</span>
            <span class="d">${d}</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-title">📝 健身项目记录</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        ${['跑步','力量训练','瑜伽','游泳','骑行','跳绳','HIIT','拉伸','其他'].map(act=>`
          <button class="pill ${state._fitAct===act?'active':''}" onclick="state._fitAct='${act}';renderFitness()">${act}</button>
        `).join('')}
      </div>
      <div style="font-size:12px;color:var(--text-mute)">点击日历格子标记/取消打卡。建议每次记录具体项目和时长。</div>
    </div>
  `;
}

  const roi=monthData.reduce((s,f)=>s+(f.return||0)-(f.stake||0),0);
  const totalStake=monthData.reduce((s,f)=>s+(f.stake||0),0);

  const guessedThisMonth = monthData.filter(f=>f.guess);

      <div class="stat"><div class="stat-label">本月盈亏</div><div class="stat-value" style="color:${roi>=0?'#10b981':'#ef4444'}">${roi>=0?'+':''}${roi.toFixed(0)}</div></div>

/* ─── 实时赛事拉取（中国体育彩票 500.com API） ─── */
let _liveMatches = [];
let _liveSelected = new Set();

// 联赛名称映射
const FB_LEAGUE_MAP = {
  '英超':'英超','西甲':'西甲','意甲':'意甲','德甲':'德甲','法甲':'法甲',
  '中超':'中超','日职':'日职','韩K':'韩K联','澳超':'澳超','美职':'美职',
  '欧冠':'欧冠','欧罗巴':'欧罗巴','英冠':'英冠','荷甲':'荷甲','葡超':'葡超',
};

async function fetchLiveMatches(){
  const statusEl = document.getElementById('fb-live-status');
  const matchesEl = document.getElementById('fb-live-matches');
  if(!statusEl||!matchesEl)return;
  statusEl.textContent = '加载中...';
  matchesEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-mute)">⏳ 正在获取比赛数据...</div>';

  try{
    // 使用 500.com 的 JSON 接口获取竞彩足球赛程
    const resp = await fetch('https://trade.500.com/jczq/async.php?playtype=hhgg&callback=cb',{
      headers:{'Accept':'application/json'}
    });
    const text = await resp.text();
    // 提取 JSON（去除 callback 包裹）
    const jsonMatch = text.match(/cb\(([\s\S]*)\)/);
    if(!jsonMatch)throw new Error('解析失败');
    const data = JSON.parse(jsonMatch[1]);
    _liveMatches = [];

    if(data&&data.data&&Array.isArray(data.data)){
      data.data.forEach(item=>{
        const league = FB_LEAGUE_MAP[item.lname] || item.lname || '';
        const hscore = item.hscore!=null?parseInt(item.hscore):null;
        const ascore = item.ascore!=null?parseInt(item.ascore):null;
        let result = null;
        if(hscore!=null&&ascore!=null){
          if(hscore>ascore)result='win';
          else if(hscore===ascore)result='draw';
          else result='lose';
        }
        _liveMatches.push({
          id:item.fid||item.id,
          date:item.mdate||today(),
          league,
          home:item.hname||'',
          away:item.aname||'',
          homeScore:hscore,
          awayScore:ascore,
          result,
          status:item.status||'',
        });
      });
    }
    renderLiveMatches();
    statusEl.textContent = `✅ 共 ${_liveMatches.length} 场比赛`;
  }catch(e){
    console.warn('500.com API failed, trying backup...',e);
    // 备用：使用静态模拟数据 + 提示
    try{
      await fetchBackupMatches();
      statusEl.textContent = `⚠️ 离线数据（${_liveMatches.length}场），实时接口暂不可用`;
    }catch(e2){
      statusEl.textContent = '❌ 获取失败，请检查网络';
      matchesEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-mute)">获取比赛数据失败，请稍后重试</div>';
    }
  }
}

async function fetchBackupMatches(){
  // 备用接口：用 openligadb 或 football-data
  const today = new Date();
  const dateStr = today.toISOString().slice(0,10);
  // 使用 500.com 的另一个接口
  const resp = await fetch('https://live.500.com/static/json/live/live.json?'+Date.now(),{
    headers:{'Accept':'application/json','Referer':'https://live.500.com/'}
  });
  const text = await resp.text();
  try{
    const data = JSON.parse(text);
    _liveMatches = [];
    if(data&&data.data){
      data.data.forEach(item=>{
        const league = FB_LEAGUE_MAP[item.lname] || item.lname || '';
        _liveMatches.push({
          id:item.fid||item.id,
          date:item.mdate||dateStr,
          league,
          home:item.hname||'',
          away:item.aname||'',
          homeScore:item.hscore!=null?parseInt(item.hscore):null,
          awayScore:item.ascore!=null?parseInt(item.ascore):null,
          result:null,
          status:item.status||'',
        });
      });
    }
    renderLiveMatches();
  }catch(e){
    throw e;
  }
}

function renderLiveMatches(){
  const el = document.getElementById('fb-live-matches');
  if(!el)return;
  _liveSelected = new Set();
  if(!_liveMatches.length){
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-mute)">暂无比赛数据</div>';
    return;
  }

  el.innerHTML = `
    <table class="fb-table">
      <thead><tr>
        <th style="width:30px"><input type="checkbox" onchange="toggleAllLive(this)" title="全选"></th>
        <th>时间</th><th>联赛</th><th>主队</th><th>比分</th><th>客队</th><th>状态</th>
        <th>快速竞猜</th>
      </tr></thead>
      <tbody>${_liveMatches.map((m,i)=>`
        <tr>
          <td><input type="checkbox" data-idx="${i}" onchange="toggleLiveMatch(this)" ${_liveSelected.has(i)?'checked':''}></td>
          <td style="font-size:12px;color:var(--text-mute)">${(m.date||'').slice(-5)}</td>
          <td><span class="tag tag-gray">${esc(m.league||'其他')}</span></td>
          <td>${esc(m.home)}</td>
          <td>${m.homeScore!=null?`<strong>${m.homeScore}-${m.awayScore}</strong>`:'vs'}</td>
          <td>${esc(m.away)}</td>
          <td>${m.status?`<span class="tag ${m.status==='完'?'tag-success':m.status.includes('中')?'tag-warn':'tag-info'}">${esc(m.status)}</span>`:`<span class="tag tag-gray">待开</span>`}</td>
          <td>
            <button class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11px;margin:1px" onclick="quickGuess('${i}','win')">胜</button>
            <button class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11px;margin:1px" onclick="quickGuess('${i}','draw')">平</button>
            <button class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11px;margin:1px" onclick="quickGuess('${i}','lose')">负</button>
          </td>
        </tr>`).join('')}</tbody>
    </table>
  `;
}

function toggleLiveMatch(cb){
  const idx = parseInt(cb.dataset.idx);
  if(cb.checked)_liveSelected.add(idx);else _liveSelected.delete(idx);
}
function toggleAllLive(cb){
  if(cb.checked)_liveMatches.forEach((_,i)=>_liveSelected.add(i));
  else _liveSelected.clear();
  renderLiveMatches();
}

function quickGuess(idx,guess){
  const m = _liveMatches[idx];
  if(!m)return;
  // 确定赛果
  let result = 'win';
  if(m.homeScore!=null&&m.awayScore!=null){
    if(m.homeScore>m.awayScore)result='win';
    else if(m.homeScore===m.awayScore)result='draw';
    else result='lose';
  }
  state.data.football.unshift({
    id:uid(),
    date:m.date||today(),
    league:m.league||'其他',
    home:m.home,
    away:m.away,
    homeScore:m.homeScore,
    awayScore:m.awayScore,
    guess,
    result,
    stake:0,
    return:0,
  });
  saveState();toast('已添加竞猜：'+m.home+' vs '+m.away+' ('+(guess==='win'?'胜':guess==='draw'?'平':'负')+')');
}

function addMatchFromLive(){
  if(!_liveSelected.size){toast('请先勾选比赛');return}
  let added = 0;
  _liveSelected.forEach(idx=>{
    const m = _liveMatches[idx];
    if(!m)return;
    let result = 'win';
    if(m.homeScore!=null&&m.awayScore!=null){
      if(m.homeScore>m.awayScore)result='win';
      else if(m.homeScore===m.awayScore)result='draw';
      else result='lose';
    }
    state.data.football.unshift({
      id:uid(),
      date:m.date||today(),
      league:m.league||'其他',
      home:m.home,
      away:m.away,
      homeScore:m.homeScore,
      awayScore:m.awayScore,
      guess:null,
      result,
      stake:0,
      return:0,
    });
    added++;
  });
  saveState();renderFootball();renderOverview();toast(`已添加 ${added} 场比赛`);
}
function exportFootball(){
  const rows=[['日期','联赛','主队','比分','客队','竞猜','赛果','判定','投入','回报','盈亏']];
  state.data.football.forEach(f=>{
    rows.push([
      f.date,f.league||'',f.home||'',
      f.homeScore!=null?`${f.homeScore}-${f.awayScore}`:'',
      f.away||'',
      f.guess?(f.guess==='win'?'胜':f.guess==='draw'?'平':'负'):'',
      f.result==='win'?'胜':f.result==='draw'?'平':'负',

    ]);

const TAG_POOL=['#干货分享','#生活技巧','#实用','#建议收藏','#涨知识','#冷知识','#科普','#避坑指南','#经验分享','#新人必看','#深度好文','#思考','#观点','#感悟','#成长','#自律','#效率','#自我提升','#情绪管理','#情感','#共鸣','#真实','#励志','#正能量','#治愈','#搞笑','#反转','#惊喜','#挑战','#日常'];
function generateTags(){
  const text=prompt('粘贴文案/选题内容：');
  if(!text)return;
  const picked=[];
  const kwMap={'学习':'#学习','读书':'#阅读','工作':'#职场','钱':'#理财','感情':'#情感','吃':'#美食','旅行':'#旅行','健身':'#健身','孩子':'#育儿','减肥':'#减肥','穿搭':'#穿搭','美妆':'#美妆'};
  Object.entries(kwMap).forEach(([k,tag])=>{if(text.includes(k)&&!picked.includes(tag))picked.push(tag)});
  while(picked.length<8){const r=TAG_POOL[Math.floor(Math.random()*TAG_POOL.length)];if(!picked.includes(r))picked.push(r)}
  openModal(`
    <div class="modal-title">🏷️ 标签生成</div>
    <div class="list">${picked.map(t=>`<div class="list-item"><div class="title">${t}</div><button class="icon-btn" onclick="navigator.clipboard.writeText('${t}');toast('已复制')">📋</button></div>`).join('')}</div>
    <div class="modal-actions"><button class="btn" onclick="navigator.clipboard.writeText('${picked.join(' ')}');toast('已全部复制')">复制全部</button></div>
  `);
}

function rewriteCopy(){
  const text=prompt('粘贴需要改写的文案：');
  if(!text)return;
  const sentences=text.split(/[。！？\n]/).filter(s=>s.trim());
  const variations=[s=>s.replace(/很/g,'非常'),s=>`说到${s}，其实还有更深层的意义`,s=>`${s} —— 这背后的逻辑值得深思`];
  const out=sentences.slice(0,3).map((s,i)=>`【改写${i+1}】\n${variations[i%variations.length](s)}。`).join('\n\n');
  openModal(`
    <div class="modal-title">✍️ 文案改写</div>
    <div style="font-size:12px;color:var(--text-mute);margin-bottom:8px">原文：${esc(text.slice(0,80))}${text.length>80?'...':''}</div>
    <textarea class="script" style="min-height:180px;width:100%" readonly>${esc(out)}</textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      <button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('#modal-content textarea').value);toast('已复制')">复制结果</button>
    </div>
  `);
}

function importHotspots(){

  if(!text)return;
  const lines=text.split('\n').filter(l=>l.trim());let added=0;
  lines.forEach(line=>{
    const parts=line.split('|').map(s=>s.trim());
    if(!parts[0])return;
    state.data.hotspots.unshift({id:uid(),title:parts[0],platform:parts[1]||'',heat:parseInt(parts[2])||5,angle:parts[3]||'',tags:parts[4]?parts[4].split(',').map(s=>s.trim()).filter(Boolean):[],link:parts[5]||'',date:today()});
    added++;
  });
  saveState();renderHotspot();toast(`已导入 ${added} 条`);
}

          <div class="title">
            <input data-mid="${m.id}" value="${esc(m.name)}" onchange="renameModule('${m.id}',this.value)" style="font-weight:500;border:none;background:transparent;padding:0">
            <div style="font-size:11px;color:var(--text-mute)">分组：${esc(m.group)}</div>
          </div>
          <span class="switch ${m.enabled?'on':''}" onclick="toggleModule('${m.id}')"></span>
        </div>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-title">💾 数据管理</div>
      <div class="toolbar">
        <button class="btn btn-sm" onclick="exportAll()">📤 备份全部 (JSON)</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-file').click()">📥 恢复数据</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
        <button class="btn btn-outline btn-sm" onclick="exportExcelAll()">📊 导出 Excel</button>
        <button class="btn btn-sm btn-danger" onclick="clearAllData()">🗑 清空所有</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-title">ℹ️ 关于</div>
      <div style="font-size:13px;color:var(--text-soft);line-height:1.8">
        <p>🌸 <strong>小何根据地</strong> v2.0</p>
        <p>📦 单 HTML 文件 + localStorage 本地存储，零网络依赖</p>
        <p>📱 可部署到 GitHub Pages，手机加入主屏幕当 App 使用</p>
        <p>🎀 粉色系主题，模块可自定义开关与名称</p>
        <p>⚽ 包含竞彩足球板块 · 💪 包含健身打卡记录</p>
      </div>
    </div>
  `;
}
function renameModule(id,name){
  const m=state.modules.find(x=>x.id===id);
  if(m){m.name=name.trim()||m.name;saveState();renderNav();renderOverview()}
}
function toggleModule(id){
  const m=state.modules.find(x=>x.id===id);
  if(m){m.enabled=!m.enabled;saveState();renderAllModules();renderNav()}
}
function clearAllData(){
  if(!confirm('确认清空所有数据？此操作不可恢复！'))return;
  if(!confirm('再次确认：真的要清空吗？'))return;
  localStorage.removeItem(STORE_KEY);state=loadState();renderAllModules();renderNav();toast('已清空');
}

/* ─── Import/Export ─── */
function exportAll(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`小何根据地-备份-${today()}.json`;a.click();URL.revokeObjectURL(url);toast('已导出备份');
}
function importAll(){document.getElementById('import-file').click()}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(parsed.modules&&parsed.data){state=parsed;saveState();renderAllModules();renderNav();toast('已恢复')}
      else{toast('文件格式错误')}
    }catch(err){toast('解析失败')}
  };
  reader.readAsText(file);e.target.value='';
}
function exportExcelAll(){
  const wb=XLSX.utils.book_new();
  const addSheet=(name,rows)=>{XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name)};
  addSheet('待办',[['日期','内容','优先级','状态']].concat(state.data.todo.map(t=>[t.date,t.text,t.priority,t.done?'已完成':'未完成'])));
  addSheet('记账',[['日期','类型','分类','金额','备注']].concat(state.data.finance.map(f=>[f.date,f.type,f.category,f.amount,f.note||''])));
  addSheet('阅读',[['书名','作者','总页数','当前页','状态']].concat(state.data.reading.map(b=>[b.title,b.author||'',b.totalPages,b.progress,b.done?'已完成':'在读'])));
  addSheet('灵感',[['日期','分类','标题','标签','内容']].concat(state.data.ideas.map(i=>[i.date,i.category||'',i.title,(i.tags||[]).join(','),i.content||''])));
  addSheet('脚本',[['日期','标题','标签','字数','内容']].concat(state.data.scripts.map(s=>[s.date,s.title,(s.tags||[]).join(','),(s.content||'').length,s.content||''])));
  addSheet('重要日期',[['事件','日期','每年重复']].concat(state.data.countdown.map(c=>[c.name,c.date,c.repeat?'是':'否'])));
  addSheet('热点',[['日期','平台','标题','热度','角度','标签']].concat(state.data.hotspots.map(h=>[h.date,h.platform||'',h.title,h.heat||'',h.angle||'',(h.tags||[]).join(',')])));
  addSheet('竞彩',[['日期','联赛','主队','比分','客队','结果','投入','回报','盈亏']].concat(state.data.football.map(f=>[f.date,f.league||'',f.home||'',f.homeScore!=null?`${f.homeScore}-${f.awayScore}`:'',f.away||'',f.result,f.stake||0,f.return||0,(f.return||0)-(f.stake||0)])));
  addSheet('健身',[['日期','打卡']].concat(Object.entries(state.data.fitness).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>[k,v?'✓':'✗'])));
  addSheet('复盘',[['期间','标题','数据','优点','不足','方案']].concat(state.data.reviews.map(r=>[r.period,r.title,r.data||'',r.pros||'',r.cons||'',r.plan||''])));
  const ve=state.data.videoedit;
  addSheet('剪辑素材',[['名称','类型','来源','链接','备注']].concat((ve.materials||[]).map(m=>[m.name,m.type||'',m.source||'',m.url||'',m.note||''])));
  addSheet('剪辑技巧',[['标题','分类','内容','来源']].concat((ve.skills||[]).map(s=>[s.title,s.category||'',s.content||'',s.source||''])));
  addSheet('剪辑模板',[['名称','适用场景','步骤','示例链接']].concat((ve.templates||[]).map(t=>[t.name,t.scene||'',t.steps||'',t.exampleUrl||''])));
  addSheet('抖音分析',[['日期','博主','链接','标题','文案','结构','技巧','标签']].concat((ve.analysis||[]).map(a=>[a.date,a.creator||'',a.url||'',a.title||'',a.copy||'',a.structure||'',a.techniques||'',(a.tags||[]).join(',')])));
  XLSX.writeFile(wb,`小何根据地-全部数据-${today()}.xlsx`);toast('已导出全部数据');
}

/* ─── Init ─── */
renderNav();
renderAllModules();
</script>

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/H-genjudi/sw.js').then(function(reg){
    console.log('SW registered');
    reg.update();
  }).catch(function(e){
    console.log('SW failed:', e);
  });
}
</script>
</body>
